# Argo CD cluster secret for the cluster Argo CD runs in. Labels only: the
# values that come from Terraform are added as annotations during bootstrap
# and never written to this file:
#   portfolio/ecr-registry  ECR registry host (contains the AWS account ID)
#   portfolio/vpc-id        VPC ID for the AWS Load Balancer Controller
# See docs/runbooks/cluster-operations.md in the workspace repo.
apiVersion: v1
kind: Secret
metadata:
  name: in-cluster
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    # Every ApplicationSet selects on this label.
    portfolio/cluster: prod
type: Opaque
stringData:
  name: in-cluster
  server: https://kubernetes.default.svc
  config: '{"tlsClientConfig":{"insecure":false}}'
