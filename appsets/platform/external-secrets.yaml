# External Secrets Operator and the SSM Parameter Store ClusterSecretStore.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            portfolio/cluster: prod
  # Deleting this file or the generated Application leaves the workload running.
  syncPolicy:
    preserveResourcesOnDeletion: true
  # Lets a runbook turn auto-sync off on the Application without this
  # ApplicationSet turning it back on.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  template:
    metadata:
      name: external-secrets
    spec:
      project: default
      source:
        repoURL: https://github.com/vudaian24/portfolio-gitops.git
        targetRevision: main
        path: charts/external-secrets
        helm:
          releaseName: external-secrets
      destination:
        server: '{{ .server }}'
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # Large CRDs (Prometheus, External Secrets) exceed the client-side
          # annotation limit; Argo CD also needs it to take over its own install.
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
