# AppProject for every Application generated by appsets/. Lives in appsets/ so
# the root Application applies it first (sync-wave -1), before the
# ApplicationSets that reference it. The root Application itself stays in
# the default project.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: portfolio
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Platform add-ons and the portfolio-web app.
  sourceRepos:
    - https://github.com/vudaian24/portfolio-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: portfolio-web
  # Cluster-scoped kinds the charts render (helm template --include-crds).
  # Namespaced kinds are not restricted.
  clusterResourceWhitelist:
    # CreateNamespace=true makes Argo CD manage the Namespace object itself.
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: networking.k8s.io
      kind: IngressClass
    - group: elbv2.k8s.aws
      kind: IngressClassParams
    - group: external-secrets.io
      kind: ClusterSecretStore
