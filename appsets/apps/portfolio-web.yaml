# The portfolio site. The ECR registry host comes from the in-cluster secret annotation; the image tag from values-prod.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: portfolio-web
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            portfolio/cluster: prod
  # Deleting this file or the generated Application leaves the workload running.
  syncPolicy:
    preserveResourcesOnDeletion: true
  # Lets a runbook turn auto-sync off on the Application without this
  # ApplicationSet turning it back on.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  template:
    metadata:
      name: portfolio-web
    spec:
      project: portfolio
      source:
        repoURL: https://github.com/vudaian24/portfolio-gitops.git
        targetRevision: main
        path: charts/portfolio-web
        helm:
          releaseName: portfolio-web
          valueFiles:
            - values.yaml
            - values-prod.yaml
          parameters:
            - name: image.registry
              value: '{{ $v := index .metadata.annotations "portfolio/ecr-registry" }}{{ if not $v }}{{ fail "annotation portfolio/ecr-registry is missing or empty on the in-cluster secret" }}{{ end }}{{ $v }}'
      destination:
        server: '{{ .server }}'
        namespace: portfolio-web
      syncPolicy:
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: restricted
            # The AWS Load Balancer Controller adds a readiness gate to new pods
            # here: a pod is Ready only once its ALB target is healthy, so a
            # rolling update keeps the old pod until the ALB can reach the new one.
            # Under /spec/syncPolicy, which ignoreApplicationDifferences skips: a
            # change here reaches an existing Application only by a patch on it.
            elbv2.k8s.aws/pod-readiness-gate-inject: enabled
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # Large CRDs (Prometheus, External Secrets) exceed the client-side
          # annotation limit; Argo CD also needs it to take over its own install.
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
