# Lean Argo CD (ADR 0005): one replica each, no Dex, no notifications.
# The UI is reached with `kubectl port-forward`, never exposed.
# Requests and limits follow the node budget in docs/architecture/aws-eks.md
# (Argo CD: about 0.35 to 0.55 GiB in total).
argo-cd:
  crds:
    # Keep Application and ApplicationSet CRDs if the release is deleted,
    # so the apps it manages are not removed with it.
    keep: true

  configs:
    cm:
      # Poll Git every 3 minutes. The repository is public, so no webhook.
      timeout.reconciliation: 180s
    params:
      # At most two `helm template` runs at once. Rendering kube-prometheus-stack
      # and its dependencies in parallel got the repo-server OOM-killed at 256Mi
      # in the kind test.
      reposerver.parallelism.limit: 2
      # Fewer workers than the defaults (20 and 10); one cluster, six apps.
      controller.status.processors: 5
      controller.operation.processors: 2

  controller:
    replicas: 1
    # Caches every resource it manages, including the large Prometheus and
    # External Secrets CRDs. 384Mi was OOM-killed in the kind test, and 768Mi
    # was OOM-killed on EKS on 2026-10-25, 44 s after a kube-prometheus-stack
    # sync. Steady use is about 415Mi, so the extra headroom is for sync peaks,
    # not for idle (parent docs/adr/0011).
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    # Soft limit for the Go runtime at 90 % of the hard limit: approaching
    # 922MiB the GC runs more often, which costs CPU instead of the kubelet
    # killing the container. It does not help if the live heap really exceeds
    # the limit.
    env:
      - name: GOMEMLIMIT
        value: 922MiB

  repoServer:
    replicas: 1
    # Runs helm for every render; the peak is while it builds chart dependencies.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

  server:
    replicas: 1
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 160Mi

  applicationSet:
    replicas: 1
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi

  redis:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

  dex:
    enabled: false

  notifications:
    enabled: false
