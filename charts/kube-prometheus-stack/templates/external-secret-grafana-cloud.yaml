{{- /*
Basic auth for the Prometheus remote write to Grafana Cloud. Both values are in
SSM: the metrics instance ID and an access policy token with metrics:write only.
Wave -1 so the Secret exists before the Prometheus resource that names it.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cloud-metrics
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.grafanaCloud.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.grafanaCloud.clusterSecretStore }}
  target:
    name: grafana-cloud-metrics
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.grafanaCloud.userParameter }}
    - secretKey: password
      remoteRef:
        key: {{ .Values.grafanaCloud.tokenParameter }}
