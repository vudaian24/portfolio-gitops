{{- /*
Grafana admin login. The password is in SSM; the user is fixed to admin.
The CRD comes from the external-secrets Application, which may sync later.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.grafanaAdmin.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.grafanaAdmin.clusterSecretStore }}
  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        admin-user: admin
        admin-password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.grafanaAdmin.passwordParameter }}
