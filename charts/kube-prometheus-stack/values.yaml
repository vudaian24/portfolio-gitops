# Monitoring (ADR 0005): Prometheus keeps 3 days on an emptyDir, scrapes every
# 60 s, no Alertmanager. Grafana has no volume; dashboards come from ConfigMaps.
# Both are reached with `kubectl port-forward`.
kube-prometheus-stack:
  crds:
    enabled: true

  alertmanager:
    enabled: false

  # The EKS control plane is managed by AWS and not reachable for scraping.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  # kube-proxy binds its metrics port to localhost on EKS.
  kubeProxy:
    enabled: false
  # The API server histograms were about 73 % of all series (51k of 70k) and
  # the biggest part of Prometheus memory. The EKS control plane is AWS's to
  # run, so stop scraping it; this also drops the API server dashboard.
  kubeApiServer:
    enabled: false

  defaultRules:
    rules:
      alertmanager: false
      etcd: false
      kubeControllerManager: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
      kubeProxy: false
      # No API server metrics (kubeApiServer above).
      kubeApiserverAvailability: false
      kubeApiserverBurnrate: false
      kubeApiserverHistogram: false
      kubeApiserverSlos: false

  prometheus:
    prometheusSpec:
      retention: 3d
      retentionSize: 2GB
      scrapeInterval: 60s
      evaluationInterval: 60s
      # Pick up ServiceMonitors and rules from every release, not only this one.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      # No storageSpec: data lives on an emptyDir and is lost on restart.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
          ephemeral-storage: 1Gi
        limits:
          memory: 512Mi
          ephemeral-storage: 3Gi

  prometheusOperator:
    resources:
      requests:
        cpu: 20m
        memory: 48Mi
      limits:
        memory: 96Mi
    prometheusConfigReloader:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi

  kube-state-metrics:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

  prometheus-node-exporter:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 48Mi

  grafana:
    # Admin login comes from the Secret `grafana-admin`, which
    # templates/external-secret-grafana-admin.yaml builds from SSM. Without
    # existingSecret, the chart generates a random password on every render
    # and Argo CD would always show a diff.
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    persistence:
      enabled: false
    defaultDashboardsEnabled: true
    sidecar:
      dashboards:
        enabled: true
      # Load the Prometheus datasource once from an init container instead of a
      # sidecar that watches for changes and holds about 80Mi. LIST exits after
      # one pass; Grafana is not up yet, so skip the reload call. A datasource
      # change needs a Grafana restart.
      datasources:
        initDatasources: true
        watchMethod: LIST
        skipReload: true
      # Applies to the dashboards sidecar and the datasources init container.
      # 96Mi was OOM-killed in the kind test.
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 160Mi
    # Grafana 12 needs about 200Mi just to start; 192Mi was OOM-killed in the
    # kind test.
    resources:
      requests:
        cpu: 20m
        memory: 192Mi
      limits:
        memory: 384Mi
    # Up to 5 minutes to start before liveness applies. In the kind re-test
    # the liveness probe restarted Grafana once during a CPU-heavy start.
    startupProbe:
      httpGet:
        path: /api/health
        port: grafana
      periodSeconds: 10
      failureThreshold: 30

# Grafana admin Secret, built from SSM by templates/external-secret-grafana-admin.yaml.
grafanaAdmin:
  clusterSecretStore: aws-parameter-store
  refreshInterval: 1h
  passwordParameter: /portfolio/prod/grafana-admin-password
