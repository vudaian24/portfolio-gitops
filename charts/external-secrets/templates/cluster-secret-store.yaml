{{- /*
SSM Parameter Store for every namespace. No auth block: the operator uses
the AWS SDK default credential chain, which picks up EKS Pod Identity.
The CRD comes from the dependency in this same chart, so Argo CD skips the
dry run until it exists.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.clusterSecretStore.name }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ .Values.clusterSecretStore.region }}
