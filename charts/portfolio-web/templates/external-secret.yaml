{{- if .Values.externalSecret.enabled }}
{{- /* The CRD comes from the external-secrets Application, which may sync later. */ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "portfolio-web.name" . }}-telegram
  labels:
    {{- include "portfolio-web.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.clusterSecretStore }}
  target:
    name: {{ include "portfolio-web.name" . }}-telegram
    creationPolicy: Owner
  data:
    {{- range $key, $parameter := .Values.externalSecret.data }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $parameter }}
    {{- end }}
{{- end }}
