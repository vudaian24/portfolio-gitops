{{- if .Values.externalSecret.enabled }}
{{- /* The CRD comes from the external-secrets Application, which may sync later. */ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "portfolio-web.name" . }}-telegram
  labels:
    {{- include "portfolio-web.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.clusterSecretStore }}
  target:
    name: {{ include "portfolio-web.name" . }}-telegram
    creationPolicy: Owner
  data:
    {{- /* The whole Secret is loaded into the web container, so only its own Telegram parameters are allowed. */}}
    {{- range $key, $parameter := .Values.externalSecret.data }}
    {{- if not (regexMatch "^/portfolio/prod/telegram-[a-z0-9-]+$" (toString $parameter)) }}
    {{- fail (printf "externalSecret.data.%s: %q is outside /portfolio/prod/telegram-*" $key (toString $parameter)) }}
    {{- end }}
    - secretKey: {{ $key | quote }}
      remoteRef:
        key: {{ $parameter | quote }}
    {{- end }}
{{- end }}
