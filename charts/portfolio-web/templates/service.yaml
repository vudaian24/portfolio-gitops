apiVersion: v1
kind: Service
metadata:
  name: {{ include "portfolio-web.name" . }}
  labels:
    {{- include "portfolio-web.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "portfolio-web.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
