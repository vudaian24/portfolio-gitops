{{- if .Values.ingress.enabled }}
{{- $hosts := .Values.ingress.hosts }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "portfolio-web.name" . }}
  labels:
    {{- include "portfolio-web.labels" . | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: {{ .Values.ingress.loadBalancerName }}
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # HTTPS only. Cloudflare connects on 443 with SSL mode Full (strict).
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-policy: {{ .Values.ingress.sslPolicy }}
    # Use the Terraform security group (443 from Cloudflare only) instead of
    # one that allows the whole internet, and let the controller open the
    # path from the ALB to the pods.
    alb.ingress.kubernetes.io/security-groups: {{ .Values.ingress.securityGroup }}
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
    alb.ingress.kubernetes.io/healthcheck-path: /web-api/health
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    # No secretName: the controller finds the ACM certificate by host name.
    - hosts:
        {{- toYaml $hosts | nindent 8 }}
  rules:
    {{- range $hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "portfolio-web.name" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
