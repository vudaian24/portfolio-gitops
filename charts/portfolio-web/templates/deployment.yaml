apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "portfolio-web.name" . }}
  labels:
    {{- include "portfolio-web.labels" . | nindent 4 }}
spec:
  # No replicas field: the HPA owns the replica count.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Keep the old pod until the new one is ready (single node, 1 to 3 pods).
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "portfolio-web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "portfolio-web.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ include "portfolio-web.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          {{- if .Values.externalSecret.enabled }}
          envFrom:
            # Optional, so the site keeps serving pages if the secret is
            # missing; only the contact form fails until it syncs.
            - secretRef:
                name: {{ include "portfolio-web.name" . }}-telegram
                optional: true
          {{- end }}
          startupProbe:
            httpGet:
              path: /web-api/health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /web-api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /web-api/health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Next.js writes the image optimization cache here.
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
